name: Python 3.13 ARM64 compatibility

on:
    push:
      branches: [ "dependency-upgrade" ]
  
    pull_request:
      branches: [ "dependency-upgrade" ]

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    container:
      image: python:3.13-slim-bookworm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          python --version
          uname -m
          cat /etc/os-release

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-py313-test-pi.txt

      - name: Check dependencies
        run: |
          python -m pip check
