name: Python 3.13 ARM64 compatibility

on:
    push:
      branches: [ "dependency-upgrade" ]
  
    pull_request:
      branches: [ "dependency-upgrade" ]

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    container:
      image: python:3.13-slim-bookworm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          python --version
          uname -m
          cat /etc/os-release
      
      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-py313-test-pi.txt

      - name: Check dependencies
        run: |
          python -m pip check

      - name: Nodejs Setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start backend
        run: |
          python -m App.py > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Start Celery
        run: |
          celery -A worker.celery worker \
            --concurrency=1 \
            --loglevel=info \
            --pool=threads > celery.log 2>&1 &
          echo $! > celery.pid

      - name: Update APT
        run:
          apt-get update
    
      - name: Build Essentials Only
        run:
          apt-get install -y --no-install-recommends build-essential


      - name: Start Frontend
        run: |
          npm ci
          npm run dev -- --host 0.0.0.0 > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Verify Processes
        run: |
          sleep 15

          echo "=====Backend======"
          cat backend.log

          echo "=====Celery======"
          cat celery.log

          echo "=====Frontend===="
          cat frontend.log

          kill -0 $(cat backend.pid)
          kill -0 $(cat celery.pid)
          kill -0 $(cat frontend.pid)
